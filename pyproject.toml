[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "beartype-rs"
version = "0.1.0"
description = "Rust-accelerated runtime type checking for Python, in the spirit of beartype"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy"]

[tool.maturin]
python-source = "python"
module-name = "beartype_rs._beartype_rs"
features = ["pyo3/extension-module"]
